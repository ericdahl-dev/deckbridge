name: Release

# Tag a version on main (for example v0.1.0) to archive the Mac app, sign it and upload it to TestFlight, the way
# ShowRecorder ships. Signs with one fixed Apple Distribution certificate and the Mac Installer Distribution
# certificate (the upload is a signed installer package), so no run creates a certificate. The secrets are org
# secrets shared with ShowRecorder; see docs/DEVELOPING.md, "Releasing to TestFlight".
# After the upload, the distribute job hands the build to testers (#180): What to Test from docs/TESTFLIGHT.md and the
# "Internal" group. Only a tag whose annotation says [external], or a run by hand with external on, also adds it to the
# "Syndicate" group and submits it for Beta App Review (#244). A plain tag is internal only. Run the workflow by hand
# (workflow_dispatch) with a version and build number to distribute a build that's already uploaded, without building
# it again.
# Pull requests and forks never run this: it only fires on a tag pushed to this repository, or by hand.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
  workflow_dispatch:
    inputs:
      version:
        description: Marketing version of the uploaded build, such as 1.0.1
        required: true
      build:
        description: Its build number, run.attempt, such as 2.1
        required: true
      dry_run:
        description: Read everything and change nothing (prints what it would do)
        type: boolean
        default: false
      external:
        description: Also send it to the external group and Beta App Review (off means Internal only)
        type: boolean
        default: false
      replace_what_to_test:
        description: Replace the build's What to Test with this branch's docs/TESTFLIGHT.md (off keeps a build's own)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  testflight:
    name: TestFlight (macOS)
    if: github.repository == 'ericdahl-dev/deckbridge' && github.event_name == 'push'
    # Standard GitHub-hosted runner, as in ci.yml. Avoid -large/-xlarge (always billed).
    runs-on: macos-26
    timeout-minutes: 60
    outputs:
      version: ${{ steps.tag.outputs.version }}
      build: ${{ steps.tag.outputs.build }}
      external: ${{ steps.tag.outputs.external }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      BUNDLE_ID: dev.ericdahl.ControllerBridge
      PROFILE_NAME: ControllerBridge CI Mac App Store
      PROFILE_TYPE: MAC_APP_STORE
    steps:
      # All eight, by name only (never a value), so a missing one stops here instead of failing later in signing.
      - name: Check the secrets
        env:
          HAS_ASC_KEY_ID: ${{ secrets.ASC_KEY_ID != '' }}
          HAS_ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID != '' }}
          HAS_ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 != '' }}
          HAS_DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM != '' }}
          HAS_DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 != '' }}
          HAS_DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD != '' }}
          HAS_MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 != '' }}
          HAS_MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD != '' }}
        run: |
          missing=""
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 DEVELOPMENT_TEAM DIST_CERT_P12_BASE64 DIST_CERT_PASSWORD \
            MAC_INSTALLER_CERT_P12_BASE64 MAC_INSTALLER_CERT_PASSWORD; do
            flag="HAS_$name"
            [ "${!flag}" = true ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::Missing release secrets:$missing. Add them, or give this repository access to the org secrets (see docs/DEVELOPING.md)."
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check the tag
        id: tag
        run: |
          # Only releases from main, so a stray tag on a feature branch can't ship.
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Tag a commit that has been merged."
            exit 1
          fi
          # The marketing version is the tag; the build number is the run number plus the attempt, so re-running
          # a tag uploads a new, higher build instead of a duplicate.
          echo "MARKETING_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"
          echo "BUILD_NUMBER=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_ENV"
          echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          echo "build=${GITHUB_RUN_NUMBER}.${GITHUB_RUN_ATTEMPT}" >> "$GITHUB_OUTPUT"
          # External testers only when the annotated tag's message says [external] (#244). Fetch the tag itself so
          # its annotation is here, not a lightweight copy.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          external="$(scripts/tag-external.sh "${GITHUB_REF_NAME}")"
          echo "external=${external}" >> "$GITHUB_OUTPUT"
          echo "External testers: ${external}"

      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
          echo "Version ${MARKETING_VERSION} (${BUILD_NUMBER})"

      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen

      - name: Generate the project
        run: xcodegen generate

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set +x
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      - name: Import the certificates
        env:
          DIST_CERT_P12_BASE64: ${{ secrets.DIST_CERT_P12_BASE64 }}
          DIST_CERT_PASSWORD: ${{ secrets.DIST_CERT_PASSWORD }}
          MAC_INSTALLER_CERT_P12_BASE64: ${{ secrets.MAC_INSTALLER_CERT_P12_BASE64 }}
          MAC_INSTALLER_CERT_PASSWORD: ${{ secrets.MAC_INSTALLER_CERT_PASSWORD }}
        run: |
          set +x
          umask 077
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(uuidgen)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          # Apple Distribution signs the app; Mac Installer Distribution signs the installer package the upload is.
          printf '%s' "$DIST_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" -k "$KEYCHAIN" -P "$DIST_CERT_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          printf '%s' "$MAC_INSTALLER_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/installer.p12"
          security import "$RUNNER_TEMP/installer.p12" -k "$KEYCHAIN" -P "$MAC_INSTALLER_CERT_PASSWORD" -T /usr/bin/productbuild -T /usr/bin/security
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" >/dev/null
          # The existing keychains, one word each, after the new one.
          # shellcheck disable=SC2046
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          echo "KEYCHAIN=$KEYCHAIN" >> "$GITHUB_ENV"
          # Both certificates last a year and are shared with ShowRecorder: an expired one stops the upload.
          for cert in "Apple Distribution" "3rd Party Mac Developer Installer"; do
            security find-certificate -c "$cert" -p "$KEYCHAIN" | openssl x509 -noout -enddate \
              | sed "s/^notAfter=/$cert certificate expires: /" || echo "::warning::Couldn't read the $cert certificate's expiry"
          done
          # The certificate's serial number, so ci_profile.py finds it in App Store Connect.
          SERIAL="$(security find-certificate -c "Apple Distribution" -p "$KEYCHAIN" | openssl x509 -noout -serial | cut -d= -f2)"
          echo "CERT_SERIAL=$SERIAL" >> "$GITHUB_ENV"
          security find-identity -v -p codesigning "$KEYCHAIN" | sed -E 's/[0-9A-F]{40}/<hash>/'

      - name: Get the Mac App Store provisioning profile
        run: |
          set +x
          python3 -I scripts/ci_profile.py

      - name: Archive
        run: |
          set -o pipefail
          xcodebuild archive \
            -project ControllerBridge.xcodeproj -scheme ControllerBridge -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/ControllerBridge.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" APP_PROFILE_NAME="$PROFILE_NAME" \
            OTHER_CODE_SIGN_FLAGS="--keychain $KEYCHAIN" \
            MARKETING_VERSION="$MARKETING_VERSION" CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            2>&1 | tee "$RUNNER_TEMP/archive.log"

      - name: Check the archive before uploading
        run: scripts/preflight.sh "$RUNNER_TEMP/ControllerBridge.xcarchive"

      - name: Upload to TestFlight
        run: |
          set -o pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>installerSigningCertificate</key><string>3rd Party Mac Developer Installer</string>
            <key>provisioningProfiles</key>
            <dict><key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string></dict>
            <key>teamID</key><string>${DEVELOPMENT_TEAM}</string>
            <key>uploadSymbols</key><true/>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/ControllerBridge.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            2>&1 | tee "$RUNNER_TEMP/upload.log"

      - name: Remove the keys and the keychain
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc" "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP/installer.p12"
          [ -n "${KEYCHAIN:-}" ] && security delete-keychain "$KEYCHAIN" || true
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/*.provisionprofile || true
          rm -f ~/Library/Developer/Xcode/UserData/Provisioning\ Profiles/*.provisionprofile || true

      - name: Keep the logs when something failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: release-logs
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/upload.log
          retention-days: 14

  distribute:
    name: Distribute on TestFlight
    needs: testflight
    # After a successful upload, or by hand for a build that's already uploaded.
    if: >-
      always() && github.repository == 'ericdahl-dev/deckbridge' &&
      (github.event_name == 'workflow_dispatch' || needs.testflight.result == 'success')
    # The API calls need only Python and openssl.
    runs-on: ubuntu-latest
    # Processing usually takes 5 to 30 minutes; the script gives up after an hour.
    timeout-minutes: 75
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      BUNDLE_ID: dev.ericdahl.ControllerBridge
      VERSION: ${{ inputs.version || needs.testflight.outputs.version }}
      BUILD_NUMBER: ${{ inputs.build || needs.testflight.outputs.build }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
      # Internal only unless asked (#244): [external] in the tag message, or external on when run by hand.
      EXTERNAL: ${{ (inputs.external || needs.testflight.outputs.external == 'true') && '1' || '' }}
      # Sent again by hand, a build keeps the What to Test it shipped with, unless asked to replace it (#312).
      KEEP_WHAT_TO_TEST: ${{ github.event_name == 'workflow_dispatch' && !inputs.replace_what_to_test && '1' || '' }}
    steps:
      - name: Check the version and build number
        run: |
          echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$' || { echo "::error::Version '$VERSION' isn't like 1.0.1"; exit 1; }
          echo "$BUILD_NUMBER" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$' || { echo "::error::Build '$BUILD_NUMBER' isn't like 2.1"; exit 1; }
          echo "Distributing ${VERSION} (${BUILD_NUMBER}), $([ "$EXTERNAL" = 1 ] && echo 'Internal and external' || echo 'Internal only')"

      - uses: actions/checkout@v4

      - name: Write the App Store Connect key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          set +x
          umask 077
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          echo "ASC_KEY_PATH=$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Safe to re-run: each step checks before it changes anything (scripts/testflight_distribute.py).
      - name: What to Test, groups and Beta App Review
        run: |
          set +x
          python3 -I scripts/testflight_distribute.py

      - name: Remove the key
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
