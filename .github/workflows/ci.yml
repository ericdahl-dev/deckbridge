name: CI

on:
  pull_request:
  # The merge queue (#546): each entry is tested on top of everything ahead of it before it merges.
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Which jobs a change needs (scripts/ci_changes.py): a change to only the website, its scripts or Markdown docs
  # skips the two Mac jobs. A skipped job counts as passed for the ruleset's required Kit tests check. The Deck panel
  # job runs only for tools/deck-panel, the icon SVG its logo is made from (#669), or this workflow.
  changes:
    name: Changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      mac: ${{ steps.diff.outputs.mac }}
      deck_panel: ${{ steps.diff.outputs.deck_panel }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        # The base per event (a pull request's, a merge queue entry's, a push's previous commit): ci_changes.py.
        # An unknown base (a new branch, a force push) lists nothing, and nothing runs everything.
        run: |
          BASE="$(python3 -I scripts/ci_changes.py --base "$GITHUB_EVENT_NAME" "$GITHUB_EVENT_PATH")"
          { git diff --name-only "$BASE" HEAD || true; } | python3 -I scripts/ci_changes.py | tee -a "$GITHUB_OUTPUT"

  site:
    name: Site check
    # The website (#169): plain files, so a cheap Linux runner. Not a required check yet.
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Site check tests
        run: |
          python3 -I scripts/test_check_site.py
          python3 -I scripts/test_ci_changes.py
          # The release checklist and What to Test (#165, v1.1): Markdown, so it runs here, where a docs-only change runs.
          python3 -I scripts/test_release_docs.py
          # APP_REVIEW.md's labels against the app's strings (#29): here, which runs on every pull request, so a
          # docs-only edit and a Swift rename both run it.
          python3 -I scripts/test_app_review.py
          # The domain docs (GLOSSARY.md, docs/adr): every term still used, every ADR numbered, dated and linked.
          python3 -I scripts/test_check_domain_docs.py
          python3 -I scripts/check_domain_docs.py
      - name: LC6000 firmware tool tests
        # tools/lc6000-firmware (#430): the tests build synthetic DfuSe files, so no vendor data is needed.
        run: python3 -I -m unittest discover tools/lc6000-firmware
      - name: Site analytics tests
        run: node --test scripts/test_analytics.mjs scripts/test_capture.mjs
      - name: Site check
        run: python3 -I scripts/check_site.py website

  deck-panel:
    name: Deck panel
    # The deck panel's firmware (#615, #620): the portable code's host tests, then the CrowPanel builds. Only when
    # tools/deck-panel or this workflow changes. Skipped by its job-level `if`, it counts as passed, as Kit tests does,
    # so it can be a required check without holding up unrelated PRs (#643: #633 merged with it red). PlatformIO is
    # pinned, and the pioarduino platform it builds with takes Python 3.10-3.14.
    needs: changes
    if: needs.changes.outputs.deck_panel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: PlatformIO and its platform cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: deck-panel-pio-6.2.0-${{ hashFiles('tools/deck-panel/platformio.ini') }}
      - name: PlatformIO
        run: pip install platformio==6.2.0
      - name: Deck panel host tests
        run: |
          pio test -d tools/deck-panel -e native
          python3 -I tools/deck-panel/test_secret_logs.py
          python3 -I tools/deck-panel/check_secret_logs.py
          python3 -I tools/deck-panel/test_deck_logo.py
      # The panel keeps its Wi-Fi in NVS, set from a phone (#622): nothing to build in.
      - name: Deck panel firmware build
        run: |
          pio run -d tools/deck-panel -e crowpanel
          pio run -d tools/deck-panel -e crowpanel-test
          pio run -d tools/deck-panel -e crowpanel-perf
          # The feed path's A/B builds (#664, PR #713), so a flash of each is of a build CI has compiled.
          for ab in rx-off stamp-at-read rx-5ms rx-1ms; do pio run -d tools/deck-panel -e "crowpanel-perf-$ab"; done

  display-firmware:
    name: Display firmware
    # The drawn jog display's C code (#457), built natively with the runner's cc and tested with no hardware and no
    # vendor data: message bytes in, frames and replies out. Cheap on Linux, so it runs on every change.
    runs-on: ubuntu-latest
    # The Arm toolchain download takes a few minutes on its own, so 5 minutes timed out before any test ran (#467).
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Display firmware tests
        run: make -C tools/lc6000-display-fw test
      # The hook into the stock wd image (#467): its logic natively, then our block built with the GNU Arm toolchain
      # and its entry shims run in unicorn against a synthetic flash. Still no vendor data.
      - name: Arm toolchain and emulator
        run: |
          # The mirror's download of the toolchain (67 MB) has stalled until the job timed out (#640): apt gives up on a
          # transfer with no data for 30 s and retries it, and a whole attempt over 4 minutes is cut off and tried once more.
          apt="-o Acquire::http::Timeout=30 -o Acquire::Retries=3"
          # The block is freestanding: no newlib or libstdc++, which add about 500 MB as recommended packages.
          for attempt in 1 2; do
            timeout 240 sudo apt-get $apt update && timeout 240 sudo apt-get $apt install -y --no-install-recommends \
              gcc-arm-none-eabi binutils-arm-none-eabi && break
            [ "$attempt" = 2 ] && exit 1
            echo "Arm toolchain download attempt $attempt failed or stalled; trying once more"
          done
          arm-none-eabi-gcc --version | head -1
          python3 -m venv "$RUNNER_TEMP/fw"
          # Pinned (#515): 2.1.4 skips instructions in code under a memory-read hook, which the block tests now avoid;
          # another version could behave differently. A missing package fails the import, never skips a test.
          "$RUNNER_TEMP/fw/bin/pip" install unicorn==2.1.4
      # The 9,184-byte padding limit on this runner's GCC: prints the size with drawing and hook-only, fails if over.
      - name: Block sizes (A 9,184 bytes, B 512 KB)
        run: make -s -C tools/lc6000-display-fw arm-size
      - name: Hook and block tests
        run: make -C tools/lc6000-display-fw arm-test PYTHON="$RUNNER_TEMP/fw/bin/python"
      # The updater ships these blocks (#696): built here, staged into a copy of its catalog, then built again from
      # scratch; the staged blocks must be that second build byte for byte, so nothing but this repo's build ships.
      - name: The updater's own blocks
        run: |
          fw="$RUNNER_TEMP/fw/bin/python"
          kit=Packages/FirmwareUpdaterKit
          make -s -C tools/lc6000-display-fw arm PYTHON="$fw"
          cp -R "$kit/Sources/FirmwareCatalog/Catalog" "$RUNNER_TEMP/catalog"
          python3 -I "$kit/scripts/stage_lc6000_blocks.py" --catalog "$RUNNER_TEMP/catalog" \
            --build tools/lc6000-display-fw/build/arm --wd 00.50 --tp 00.31
          make -s -C tools/lc6000-display-fw arm PYTHON="$fw" ARM_BUILD=build/arm-again
          python3 -I "$kit/scripts/check_staged_blocks.py" --catalog "$RUNNER_TEMP/catalog" \
            --build tools/lc6000-display-fw/build/arm-again

  kit:
    name: Kit tests
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    # Standard GitHub-hosted runner: free for public repositories. Avoid -large/-xlarge (always billed).
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: |
          xcodebuild -version
          swift --version
      - name: Package tests
        working-directory: Packages/ControllerBridgeKit
        run: swift test
      # The firmware updater's own package (#684): the catalog (#686), and the build steps that add a panel image and the
      # drawn display's own blocks (#696).
      - name: Firmware updater package tests
        working-directory: Packages/FirmwareUpdaterKit
        run: |
          swift test
          python3 -I scripts/test_add_panel_image.py
          python3 -I scripts/test_sign_release.py
          python3 -I scripts/test_stage_lc6000_blocks.py
          python3 -I scripts/test_check_staged_blocks.py
      # The release workflow (#28) only runs on tags, so its scripts are tested here on every pull request.
      - name: Release script tests
        run: |
          scripts/test-preflight.sh
          scripts/test-tag-external.sh
          python3 -I scripts/test_ci_profile.py
          python3 -I scripts/test_testflight_distribute.py

  app:
    name: App build (Release, ad-hoc)
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: command -v xcodegen || brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      # Release: a Debug ad-hoc build drops the hardened runtime, so it wouldn't check what ships.
      - name: Build (ad-hoc signed)
        run: |
          xcodebuild -project ControllerBridge.xcodeproj -scheme ControllerBridge -configuration Release \
            -derivedDataPath build CODE_SIGN_IDENTITY=- CODE_SIGN_STYLE=Manual DEVELOPMENT_TEAM= build
      - name: Check the signature
        run: |
          app=build/Build/Products/Release/ControllerBridge.app
          info=$(codesign -dv "$app" 2>&1); echo "$info"
          [[ "$info" == *"flags="*"runtime"* ]] || { echo "hardened runtime missing"; exit 1; }
          ents=$(codesign -d --entitlements - --xml "$app" 2>/dev/null)
          for key in app-sandbox network.client network.server; do
            [[ "$ents" == *"com.apple.security.$key"* ]] || { echo "missing entitlement $key"; exit 1; }
          done
      # A gate since #46: it passed on the 10 main runs from 99545f9 to 23a8788 (virtual MIDI and loopback UDP work on
      # hosted macos-26 runners). A failure fails this job, which is a required check.
      - name: Smoke
        run: SMOKE_LAUNCH_TIMEOUT=60 SMOKE_REQUIRE_AUTOMATIC=1 scripts/smoke.sh
