# getdeckbridge.app (#767): serves website/ as the live site did on Coolify's static build pack, byte for byte.
# Checked by scripts/check_site_image.py.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /for/lc6000/ and /for/lc6000 both serve for/lc6000/index.html, with no redirect. Pages, CSS, JS and
    # text keep their names across releases, so the browser checks each time (an ETag makes that cheap).
    location / {
        try_files $uri $uri/index.html =404;
        add_header Cache-Control "no-cache" always;
    }

    # Fonts change only with a new name; images rarely, so a month.
    location ~* \.woff2$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location ~* \.(?:png|webp|jpg|svg|ico)$ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=2592000";
    }

    # Unknown paths get the 404 page with status 404; the page itself isn't a page of its own.
    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache" always;
    }
}
