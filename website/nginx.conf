# getdeckbridge.app (#767): serves website/ as the live site did on Coolify's static build pack, byte for byte.
# Checked by scripts/check_site_image.py.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Clean URLs: /for/lc6000/ and /for/lc6000 both serve for/lc6000/index.html, with no redirect.
    location / {
        try_files $uri $uri/index.html =404;
    }

    # Unknown paths get the 404 page with status 404; the page itself isn't a page of its own.
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }
}
