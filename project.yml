name: ControllerBridge
options:
  bundleIdPrefix: dev.ericdahl
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  ControllerBridgeKit:
    path: Packages/ControllerBridgeKit

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"

targets:
  ControllerBridge:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - Fonts
      # Geist (UI) and Geist Mono (labels and numbers), SIL OFL 1.1, as on the site; the license ships alongside (#171).
      - path: App/Fonts
        type: folder
        buildPhase: resources
    dependencies:
      - package: ControllerBridgeKit
        product: ControllerBridgeCore
      - package: ControllerBridgeKit
        product: ControllerBridgePresentation
      - package: ControllerBridgeKit
        product: ControllerBridgeCapture
      - package: ControllerBridgeKit
        product: ControllerBridgeRender
    entitlements:
      path: App/ControllerBridge.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # UDP to Syndicate's OSC input (127.0.0.1:9090).
        com.apple.security.network.client: true
        # The feedback listener on 127.0.0.1:9096. CoreMIDI needs no entitlement.
        com.apple.security.network.server: true
        # Mapping import and export (#24): the open and save panels grant access to the file the user picks.
        com.apple.security.files.user-selected.read-write: true
        # The display feed over the USB cable (#667): the deck panel's serial port.
        com.apple.security.device.serial: true
    info:
      path: App/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # The name people see (#29). The product and bundle id stay ControllerBridge.
        CFBundleDisplayName: DeckBridge
        CFBundleName: DeckBridge
        # Menu bar only: no Dock icon.
        LSUIElement: true
        # Required for a Mac App Store upload (#28).
        LSApplicationCategoryType: public.app-category.music
        ITSAppUsesNonExemptEncryption: false
        # Settings' "All networks" feedback listener, for Syndicate on another Mac (#19), and the display feed to a deck
        # panel (#618): macOS 15 and later ask for Local Network access with these words. network.client covers the sends.
        NSLocalNetworkUsageDescription: DeckBridge listens for OSC feedback from Syndicate on another Mac, and sends the display feed to a deck panel, on your network.
        # The capture file (#188): JSON, saved through the save panel or attached to the owner's own email.
        UTExportedTypeDeclarations:
          - UTTypeIdentifier: dev.ericdahl.deckbridge.capture
            UTTypeDescription: DeckBridge controller capture
            UTTypeConformsTo: [public.json]
            UTTypeTagSpecification:
              public.filename-extension: [deckbridge-capture]
    settings:
      base:
        # The display name is DeckBridge (#29), set in Info.plist; the bundle id is final and stays as it is.
        PRODUCT_BUNDLE_IDENTIFIER: dev.ericdahl.ControllerBridge
        # Set by the release workflow (#28), which signs with its App Store profile; empty locally.
        PROVISIONING_PROFILE_SPECIFIER: $(APP_PROFILE_NAME)
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: false
        CODE_SIGN_STYLE: Automatic
        ENABLE_HARDENED_RUNTIME: true
