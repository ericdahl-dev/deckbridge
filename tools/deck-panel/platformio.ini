; The deck panel (#490, #615): an Elecrow CrowPanel Advance 7.0-HMI that shows DeckBridge's display feed.
;
; Portable code lives in lib/ and is tested on the Mac: pio test -e native
; The board layer lives in src/ and builds only for the panel.

[platformio]
default_envs = native

; Host tests for the portable code in lib/ (no Arduino, no board).
[env:native]
platform = native
; libsodium (#690): the system copy, from brew on the Mac and libsodium-dev on CI. The board links the ESP32 libs' own.
build_flags = -std=c++17 -Wall -Wextra -Werror
    -isystem /opt/homebrew/include -L/opt/homebrew/lib -lsodium

; The panel: Elecrow CrowPanel Advance 7.0-HMI, ESP32-S3-WROOM-1-N16R8, hardware V1.4. Board settings from the owner's
; phrasedeck firmware, which follow robominds' Crowpanel-Advance-7.0-HMI-Display (MIT, LICENSE.crowpanel-drivers).
;   pio run -e crowpanel
[env:crowpanel]
platform  = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.39/platform-espressif32.zip
framework = arduino
; Elecrow's own board JSON has native-USB ids on a CH340K board, so use the devkit plus overrides.
board = esp32-s3-devkitc-1
board_build.arduino.memory_type = qio_opi      ; quad flash, octal PSRAM
board_build.psram_type          = opi
board_build.flash_mode          = qio
board_upload.flash_size         = 16MB
board_build.partitions          = partitions.csv
extra_scripts                   = pre:git_sha.py
; The deck view; the test screen is crowpanel-test's.
build_src_filter                = +<*> -<test_screen.cpp>

; The core compiles C++ as gnu++2a, its own last -std, so no -std here: one would come first and lose. The devkit's
; board file defines ARDUINO_USB_MODE=1; ours below replaces it, without a "redefined" warning in every file.
build_unflags = -DARDUINO_USB_MODE=1
build_flags =
    -DBOARD_HAS_PSRAM
    -DCROWPANEL_ADVANCE_REV=140   ; the owner's board is V1.4 (silkscreen): the V1.3+ backlight and touch bytes
    ; No native USB: serial goes through the CH340K on GPIO43/44.
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DARDUINO_USB_MODE=0
    -DLV_CONF_SKIP
    -DLV_KCONFIG_IGNORE
    -DLV_COLOR_DEPTH=16
    ; The deck view's fonts are Geist, in src/fonts/ (#621); Montserrat 14 stays as LVGL's default font.
    ; LVGL's heap comes from PSRAM (src/lv_mem_psram.c), leaving internal RAM for the draw buffers.
    -DLV_USE_STDLIB_MALLOC=LV_STDLIB_CUSTOM
    ; Panel overrides to try from the command line, defaults in src/ (#635): -DPANEL_PCLK_HZ, -DPANEL_PCLK_ACTIVE_NEG,
    ; -DPANEL_PCLK_IDLE_HIGH, -DPANEL_HSYNC_IDLE_LOW, -DPANEL_VSYNC_IDLE_LOW, -DPANEL_DE_IDLE_HIGH, -DPANEL_BOUNCE_PX.
    ; Not set here: a default here would clash with the same flag given on the command line.

; The panel runs on ESP-IDF's esp_lcd RGB driver (#635), part of the core, so no display library.
lib_deps =
    lvgl/lvgl @ 9.1.0

upload_speed  = 921600
monitor_speed = 115200

; The test screen (#615): color bars, the build and the last touch, with no Wi-Fi. For checking the board itself.
;   pio run -e crowpanel-test
[env:crowpanel-test]
extends          = env:crowpanel
build_src_filter = +<*> -<deck_view.cpp> -<feed_udp.cpp> -<wifi_link.cpp> -<fonts/>
build_flags      =
    ${env:crowpanel.build_flags}
    -DDECK_PANEL_TEST_SCREEN
    -DLV_FONT_MONTSERRAT_20=1
    -DLV_FONT_MONTSERRAT_28=1

; The deck view plus a "perf:" line on serial every 5 s (#635): frames/s, render and swap-wait times, vsyncs/s, swap
; timeouts, feed datagrams and free internal RAM. Stack panel overrides on top, e.g.
;   PLATFORMIO_BUILD_FLAGS="-DPANEL_PCLK_HZ=14000000" pio run -e crowpanel-perf
[env:crowpanel-perf]
extends     = env:crowpanel
; -Wl,--wrap=memcpy: the bounce copy's timing (src/display_driver.cpp), in this env only.
build_flags = ${env:crowpanel.build_flags} -DPANEL_PERF_LOG -Wl,--wrap=memcpy
